# TLS front for the local stack (make up-tls); development and CI only. It ends TLS on :443 and passes everything,
# WebSocket upgrades included, to the stack's own nginx on :80, so infra/nginx/nginx.conf is not touched. The
# certificate is a throwaway one made by `make tls-cert` into infra/tls/ (never committed).
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  server_tokens off;
  sendfile on;
  client_max_body_size 60m;
  large_client_header_buffers 4 16k;
  proxy_buffer_size 16k;
  proxy_buffers 8 16k;
  proxy_busy_buffers_size 32k;

  access_log off;
  error_log /dev/stderr warn;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/tls/localhost.crt;
    ssl_certificate_key /etc/nginx/tls/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /tls-health {
      default_type text/plain;
      return 200 "ok";
    }

    location / {
      proxy_pass http://nginx:80;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # The Host header is part of the presigned storage URLs (D-068) and of the WebSocket origin check.
      proxy_set_header Host $http_host;
      proxy_set_header Origin $http_origin;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 90s;
      proxy_send_timeout 90s;
      proxy_request_buffering off;
      proxy_buffering off;
    }
  }
}
