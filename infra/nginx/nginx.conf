worker_processes auto;

events {
  worker_connections 1024;
}

http {
  server_tokens off;
  sendfile on;
  client_max_body_size 60m;
  # Safety net for large headers (D-037): sign-in cookies are kept small, but Keycloak redirects and future
  # headers must not hit the 4 KB defaults and turn into a 502.
  large_client_header_buffers 4 16k;
  proxy_buffer_size 16k;
  proxy_buffers 8 16k;
  proxy_busy_buffers_size 32k;

  log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"duration_ms":$request_time,"bytes":$body_bytes_sent}';
  # Query strings are left out of the access log so one-time tokens never reach it.
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  upstream web {
    server web:3000;
    keepalive 16;
  }

  upstream api {
    server api:8000;
  }

  upstream storage {
    server s3:8333;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  server {
    listen 80;
    server_name _;

    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 "ok";
    }

    # Chat WebSocket (§5.9). The ticket in the query string is never logged: the access log records $uri only.
    location = /ws {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header Origin $http_origin;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Above the 75 s the gateway allows between client pings (heartbeat every 25 s).
      proxy_read_timeout 90s;
      proxy_send_timeout 90s;
      proxy_buffering off;
    }

    # Chat attachments (D-068): presigned uploads and downloads on the app's own origin, so the CSP needs no
    # storage origin. The Host header is kept because it is part of the URL signature; only signed requests
    # succeed, the bucket is never public.
    location /smartazmiu/ {
      proxy_pass http://storage;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Connection "";
      proxy_request_buffering off;
      proxy_buffering off;
      add_header X-Content-Type-Options nosniff always;
      add_header Cross-Origin-Resource-Policy same-origin always;
    }

    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
    }
  }
}
