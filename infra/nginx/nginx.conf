worker_processes auto;

events {
  worker_connections 1024;
}

http {
  server_tokens off;
  sendfile on;
  client_max_body_size 30m;

  log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"duration_ms":$request_time,"bytes":$body_bytes_sent}';
  # Query strings are left out of the access log so one-time tokens never reach it.
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  upstream web {
    server web:3000;
    keepalive 16;
  }

  server {
    listen 80;
    server_name _;

    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 "ok";
    }

    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
    }
  }
}
