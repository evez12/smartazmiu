# TCP forwarder for `make load-compose` (D-082). k6 joins this container's network namespace, where localhost:80
# is the stack's nginx and localhost:8080 is Keycloak: the same addresses a browser on the host uses, so sign-in
# redirects, cookies and the WebSocket Origin check behave as in the app, without Docker host networking.
worker_processes auto;

events {
  worker_connections 8192;
}

stream {
  server {
    listen 80;
    proxy_pass nginx:80;
  }

  server {
    listen 8080;
    proxy_pass keycloak:8080;
  }
}
