# Infrastructure services start by default (`make infra`); the application services
# (`migrate`, `api`, `web`, `nginx`) belong to the `app` profile and start with `make up`.
name: smartazmiu

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  # Instance B: cache, rate limits, presence (D-053). Instance A: the job queue.
  REDIS_URL: redis://redis-cache:6379/0
  QUEUE_REDIS_URL: redis://redis:6379/0
  OIDC_ISSUER: ${OIDC_PUBLIC_URL}/realms/${KEYCLOAK_REALM}
  OIDC_JWKS_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
  OIDC_AUDIENCE: ${OIDC_AUDIENCE}
  KEYCLOAK_URL: http://keycloak:8080
  KEYCLOAK_REALM: ${KEYCLOAK_REALM}
  KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
  S3_ENDPOINT_URL: http://s3:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: smartazmiu
  # Presigned URLs point at the app's origin; nginx proxies /smartazmiu/ to the store (D-068).
  S3_PUBLIC_URL: ${APP_PUBLIC_URL}
  CLAMAV_HOST: clamav
  SENTRY_DSN: ${SENTRY_DSN_API:-}
  APP_PUBLIC_URL: ${APP_PUBLIC_URL}
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  MAIL_FROM: ${MAIL_FROM}
  VAPID_SECRET: ${VAPID_SECRET}
  VAPID_SUBJECT: ${VAPID_SUBJECT}
  TICKET_SECRET: ${TICKET_SECRET}
  MAIL_BATCH_SIZE: ${MAIL_BATCH_SIZE:-200}
  MAIL_BATCH_INTERVAL_SECONDS: ${MAIL_BATCH_INTERVAL_SECONDS:-60}

services:
  postgres:
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.11-alpine
    # Instance A (D-053): web sessions in database 1 (D-037) and the ARQ job queue in database 0. Neither may be
    # evicted or lost on a restart (D-039), so: no eviction, append-only file synced every second.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Instance B (D-053): disposable data only. When full it evicts the least recently used keys, and nothing
  # is written to disk; sessions and the job queue live in instance A (`redis`), which never evicts.
  redis-cache:
    image: redis:7.4.11-alpine
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_CACHE_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "${REDIS_CACHE_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage (see DECISIONS D-013). Credentials come from the environment.
  s3:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["/bin/sh", "/etc/seaweedfs/entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - s3-data:/data
      - ./infra/seaweedfs/entrypoint.sh:/etc/seaweedfs/entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Virus scanning for uploads (§14). The image carries its signature database; loading it takes a minute or two
  # and about 1.5 GB of memory. Signatures are refreshed by freshclam inside the container.
  clamav:
    image: clamav/clamav:1.5.3
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Tokens are issued for the browser-facing URL; containers use the internal hostname.
      KC_HOSTNAME: ${OIDC_PUBLIC_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      KEYCLOAK_TEST_USER_PASSWORD: ${KEYCLOAK_TEST_USER_PASSWORD}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      WEB_DEV_URL: ${WEB_DEV_URL}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./infra/keycloak/realm:/opt/keycloak/data/import:ro
      - ./infra/keycloak/themes:/opt/keycloak/themes:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    profiles: ["app"]
    build: ./apps/api
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["app"]
    build: ./apps/api
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      s3:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 20

  # ARQ worker: notification delivery (push, e-mail), audience sync (D-048), attachment scans (D-068).
  worker:
    profiles: ["app"]
    build: ./apps/api
    command: ["arq", "app.workers.main.WorkerSettings"]
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      s3:
        condition: service_healthy
      # Scans wait (and retry) while ClamAV loads its database, so the worker need not wait for it.
      clamav:
        condition: service_started
    healthcheck:
      test: ["CMD", "arq", "--check", "app.workers.main.WorkerSettings"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    profiles: ["app"]
    build: ./apps/web
    environment:
      APP_URL: ${APP_PUBLIC_URL}
      API_INTERNAL_URL: http://api:8000
      OIDC_ISSUER: ${OIDC_PUBLIC_URL}/realms/${KEYCLOAK_REALM}
      OIDC_INTERNAL_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_REDIS_URL: redis://redis:6379/1
      DESIGN_SYSTEM_ENABLED: ${DESIGN_SYSTEM_ENABLED:-true}
      SENTRY_DSN: ${SENTRY_DSN_WEB:-}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 20

  nginx:
    profiles: ["app"]
    image: nginx:1.30.6-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  s3-data:
  keycloak-data:
  clamav-data:
