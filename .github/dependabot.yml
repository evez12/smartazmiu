# Dependency scanning and updates (§14). Minor and patch updates are grouped to keep review load low;
# every update still has to pass CI, and pinned versions are recorded in docs/DECISIONS.md.
version: 2
updates:
  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
    groups:
      api-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  # Runtime versions are fixed by the spec (§4: Python 3.12, PostgreSQL 16, Redis 7); only patch-level image
  # updates are proposed automatically. Moving to a new runtime line is a deliberate decision (DECISIONS.md).
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      - dependency-name: redis
        update-types: [version-update:semver-major]
      - dependency-name: quay.io/keycloak/keycloak
        update-types: [version-update:semver-major]
      # Odd nginx minors are the mainline branch; the stack follows the stable (even) line.
      - dependency-name: nginx
        update-types: [version-update:semver-minor]
